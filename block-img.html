<!DOCTYPE html>
<html lang="zh-CN">
<head>
<title>The Image is blocked | Telegraph-Image</title>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--sp-3); }
  .notice-card {
    max-width: 520px; width: 100%;
    background: var(--c-white);
    border: var(--bd); border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: var(--sp-4) var(--sp-3);
    text-align: center;
    animation: pop-in var(--dur-mid) var(--ease-pop) both;
  }
  .sign {
    width: 84px; height: 84px; margin: 0 auto var(--sp-3);
    display: flex; align-items: center; justify-content: center;
    background: var(--c-coral);
    border: var(--bd); border-radius: 50%;
    box-shadow: var(--shadow);
  }
  .sign .icon { width: 40px; height: 40px; stroke-width: 2.4; }
  .notice-card h1 { font-size: 24px; margin-bottom: var(--sp-2); }
  .notice-card .msg { font-size: 15px; line-height: 1.9; color: var(--c-ink-soft); }
  .notice-card .powered { margin-top: var(--sp-3); font-size: 13px; font-weight: 500; color: var(--c-ink-soft); }
  .notice-card .powered a { font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .notice-card .powered a:hover { background: var(--c-yellow); }
</style>
</head>
<body>
  <div class="notice-card">
    <div class="sign" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.8 5.8l12.4 12.4"/></svg>
    </div>
    <h1>内容已屏蔽</h1>
    <div class="msg">
      抱歉，当前图片未能通过审查，可能含有不良内容，故无法进行加载。
      <br>
      Sorry, the current image failed to pass the review and may contain undesirable content, so it cannot be loaded.
    </div>
    <div class="powered">Powered By: <a href="https://github.com/cf-pages/Telegraph-Image">Telegraph-Image</a></div>
  </div>
</body>
</html>
