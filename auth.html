<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--sp-4) var(--sp-2); }
  .auth-card { width: 100%; max-width: 420px; }
  .field { margin-bottom: var(--sp-3); }
  .field label { display: block; font-weight: 700; margin-bottom: 6px; }
  .field .hint { font-size: 13px; color: var(--c-ink-soft); margin-top: 6px; }
  .form-banner { display: none; padding: 12px 14px; border: var(--bd-thin) solid var(--c-ink); border-radius: var(--radius-sm); font-weight: 600; margin-bottom: var(--sp-3); }
  .form-banner.show { display: block; animation: pop-in var(--dur-mid) var(--ease-pop) both; }
  .form-banner.error { background: var(--c-coral); }
  .form-banner.ok { background: var(--c-teal); }
  .auth-submit { width: 100%; }
  .auth-foot { margin-top: var(--sp-3); text-align: center; font-size: 14px; color: var(--c-ink-soft); }
  .auth-foot a { color: var(--c-ink); font-weight: 700; }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="brand-mini" href="/">
      <span class="logo-badge" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></span>
      <span id="brand-mini-name">返回首页</span>
    </a>
    <nav><span data-user-chip></span></nav>
  </header>

  <div class="auth-wrap">
    <div class="card card-pad auth-card" id="auth-card" hidden>
      <h1 style="margin:0 0 var(--sp-3); font-size:24px;">所有者登录</h1>
      <div class="form-banner" id="form-banner" role="alert"></div>
      <form id="form-login" novalidate>
        <div class="field" id="field-password">
          <label for="login-password">密码</label>
          <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" autofocus required>
          <div class="hint">输入所有者密码以进入私有云空间。</div>
        </div>
        <button class="btn btn-primary auth-submit" type="submit" id="login-submit">登 录</button>
      </form>
      <p class="auth-foot"><a href="/">返回首页</a></p>
    </div>

    <div class="card card-pad auth-card" id="auth-unavailable" hidden>
      <h1 style="margin:0 0 var(--sp-2); font-size:24px;">未启用登录</h1>
      <p>本站尚未配置所有者密码（OWNER_PASSWORD 或 BASIC_PASS）。当前为公开模式，可直接使用各项功能。</p>
      <a class="btn btn-primary" href="/">返回首页</a>
    </div>
  </div>
</div>

<script src="/assets/site-user.js" defer></script>
<script>
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var next = params.get('next') || '/';
  if (!/^\/[^/]/.test(next) && next !== '/') next = '/'; // 仅允许站内跳转，防开放重定向

  var card = document.getElementById('auth-card');
  var unavailable = document.getElementById('auth-unavailable');
  var banner = document.getElementById('form-banner');
  var form = document.getElementById('form-login');
  var passwordInput = document.getElementById('login-password');

  function showBanner(kind, text) {
    banner.className = 'form-banner show ' + kind;
    banner.textContent = text;
  }
  function hideBanner() { banner.className = 'form-banner'; }

  function post(url, payload, submitBtn) {
    submitBtn.disabled = true;
    var original = submitBtn.textContent;
    submitBtn.textContent = '请稍候…';
    return fetch(url, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { status: res.status, data: data };
      });
    }).finally(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = original;
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    hideBanner();
    var password = passwordInput.value;
    if (!password) {
      showBanner('error', '请输入密码。');
      passwordInput.focus();
      return;
    }
    post('/api/auth/login', { password: password }, document.getElementById('login-submit'))
      .then(function (r) {
        if (r.status === 200 && r.data.ok) {
          showBanner('ok', '登录成功，正在跳转…');
          window.location.href = next;
        } else {
          showBanner('error', r.data.message || '登录失败，请稍后再试。');
        }
      })
      .catch(function () { showBanner('error', '网络异常，请检查连接后重试。'); });
  });

  // 初始化：检查鉴权可用性与既有登录态
  fetch('/api/auth/me', { credentials: 'include' })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (data) {
      if (!data || !data.authEnabled) {
        unavailable.hidden = false;
        return;
      }
      if (data.loggedIn) {
        window.location.replace(next); // 已登录则直接去目标页
        return;
      }
      card.hidden = false;
    })
    .catch(function () {
      card.hidden = false; // 网络异常时仍展示表单，提交时再报错
    });
})();
</script>
</body>
</html>
