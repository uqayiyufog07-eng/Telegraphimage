<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="文件分享">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/theme.css">
<title>文件分享</title>
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: var(--sp-3); }
  .share-card {
    width: 100%; max-width: 640px; background: var(--c-white);
    border: var(--bd); border-radius: var(--radius); box-shadow: var(--shadow-lg);
    overflow: hidden;
  }
  .share-head {
    padding: var(--sp-3); background: var(--c-yellow); border-bottom: var(--bd);
    display: flex; align-items: center; gap: 12px;
  }
  .share-head .ico {
    width: 44px; height: 44px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--c-white); border: var(--bd-thin); border-radius: var(--radius);
  }
  .share-head .ico svg { width: 24px; height: 24px; }
  .share-head h1 { font-size: 20px; margin: 0; }
  .share-head .sub { font-size: 13px; color: var(--c-ink-soft); margin-top: 2px; }
  .share-body { padding: var(--sp-3); }

  .pw-form { display: flex; gap: 8px; }
  .pw-form .input { flex: 1; }
  .info-banner {
    padding: 10px 14px; background: var(--c-paper-warm); border: var(--bd-thin);
    border-radius: var(--radius-sm); font-size: 13px; margin-bottom: var(--sp-2);
  }
  .info-banner b { font-family: var(--font-head); }

  /* 文件列表 */
  .file-list { display: flex; flex-direction: column; gap: 8px; }
  .file-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    background: var(--c-paper); border: var(--bd-thin); border-radius: var(--radius-sm);
    box-shadow: var(--shadow-sm); transition: all var(--dur-fast) ease;
  }
  .file-item:hover { background: var(--c-paper-warm); transform: translateX(-1px); }
  .file-item .ico {
    width: 36px; height: 36px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    border: var(--bd-thin); border-radius: var(--radius-sm);
  }
  .file-item .ico.img { background: var(--c-pink); }
  .file-item .ico.video { background: var(--c-blue); color: var(--c-white); }
  .file-item .ico.audio { background: var(--c-coral); color: var(--c-white); }
  .file-item .ico.doc { background: var(--c-paper-warm); }
  .file-item .ico svg { width: 18px; height: 18px; }
  .file-item .meta { flex: 1; min-width: 0; }
  .file-item .name { font-weight: 600; font-size: 14px; word-break: break-all; }
  .file-item .size { font-family: var(--font-mono); font-size: 12px; color: var(--c-ink-soft); }
  .file-item .actions { flex: none; }

  .empty-state { text-align: center; padding: var(--sp-4); color: var(--c-ink-soft); }
  .error-state { text-align: center; padding: var(--sp-4); color: var(--c-coral); }
  .expired-state {
    text-align: center; padding: var(--sp-6) var(--sp-3); color: var(--c-ink-soft);
  }
  .expired-state svg { width: 64px; height: 64px; opacity: .4; margin-bottom: var(--sp-2); }

  /* 预览 */
  .preview-box { margin-top: var(--sp-2); text-align: center; }
  .preview-box img, .preview-box video, .preview-box audio { max-width: 100%; max-height: 400px; border: var(--bd-thin); border-radius: var(--radius-sm); }

  .btn-bar { display: flex; gap: 8px; margin-top: var(--sp-2); flex-wrap: wrap; }

  /* 面包屑 */
  .breadcrumb {
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
    padding: 8px 12px; margin-bottom: 12px;
    background: var(--c-paper-warm); border: var(--bd-thin); border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600;
  }
  .breadcrumb a { cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  .breadcrumb a:hover { background: var(--c-yellow); }
  .breadcrumb .sep { color: var(--c-ink-soft); margin: 0 2px; }
  .breadcrumb .current { background: var(--c-yellow); padding: 2px 8px; border-radius: 4px; }

  /* 文件夹项 */
  .file-item.folder { cursor: pointer; }
  .file-item.folder:hover { background: var(--c-yellow); }
  .file-item .ico.folder { background: var(--c-yellow); }
</style>
</head>
<body>
<div class="share-card">
  <div class="share-head">
    <span class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
    </span>
    <div>
      <h1 id="title">文件分享</h1>
      <div class="sub" id="subtitle">正在加载...</div>
    </div>
  </div>
  <div class="share-body" id="body">
    <div class="empty-state">加载中...</div>
  </div>
</div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const token = params.get('token') || location.pathname.split('/').pop();
let verifiedPassword = '';
let shareInfo = null;
let currentDir = ''; // 当前浏览的子目录（相对路径）

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatSize(b) {
  if (!b) return '-';
  const u = ['B','KB','MB','GB','TB']; let i=0,n=b;
  while(n>=1024&&i<u.length-1){n/=1024;i++;}
  return n.toFixed(i===0?0:1)+' '+u[i];
}
function iconClass(name) {
  const ext = (name.split('.').pop()||'').toLowerCase();
  if (['png','jpg','jpeg','gif','webp','avif','bmp','svg','ico','apng','tiff','tif','heic','heif','jxl'].includes(ext)) return 'img';
  if (['mp4','m4v','mov','webm','ogv','mkv','ts','3gp'].includes(ext)) return 'video';
  if (['mp3','m4a','ogg','wav','flac','aac','opus','wma','aiff','aif','mka'].includes(ext)) return 'audio';
  if (['txt','md','json','js','mjs','css','html','htm','xml','csv','log','yaml','yml','toml','ini','conf','py','java','c','cpp','cc','h','hpp','go','rs','sh','bash','zsh','sql','graphql','dockerfile','makefile','ics','vcf'].includes(ext)) return 'text';
  if (ext === 'pdf') return 'pdf';
  if (['docx','xlsx','ods','pptx','epub','zip'].includes(ext)) return 'doc';
  if (['geojson','gpx','kml','kmz'].includes(ext)) return 'map';
  return 'doc';
}
function iconSvg(t) {
  if (t==='folder') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
  if (t==='img') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
  if (t==='video') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>';
  if (t==='audio') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
  if (t==='text') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></svg>';
  if (t==='pdf') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15h1.5a1 1 0 0 1 0 2H9v-2"/><path d="M14 15v2h1.5"/></svg>';
  if (t==='map') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
}

// 动态加载 JS 库
function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector('script[data-src="' + src + '"]')) return resolve();
    const s = document.createElement('script');
    s.src = src; s.dataset.src = src;
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

// Markdown 轻量渲染
function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.+<\/li>\n?)+/g, m => '<ul>' + m + '</ul>');
  html = html.replace(/```([\s\S]+?)```/g, (m, code) => '<pre><code>' + code + '</code></pre>');
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p><\/p>/g, '');
  return html;
}

// vCard 联系人渲染
function renderVcf(text) {
  const lines = text.split(/\r?\n/);
  let name = '', email = '', tel = '', org = '';
  for (const line of lines) {
    if (line.startsWith('FN:')) name = line.slice(3);
    else if (line.startsWith('EMAIL') || line.startsWith('EMAIL:')) email = (line.split(':')[1]||'');
    else if (line.startsWith('TEL') || line.startsWith('TEL:')) tel = (line.split(':')[1]||'');
    else if (line.startsWith('ORG:')) org = line.slice(4);
  }
  return `<div style="text-align:left;padding:24px;max-width:400px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
      <div style="width:60px;height:60px;border-radius:50%;background:var(--c-yellow);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#333">${escapeHtml((name||'?')[0].toUpperCase())}</div>
      <div><div style="font-size:20px;font-weight:700">${escapeHtml(name)}</div>${org ? '<div style="color:var(--c-ink-soft)">'+escapeHtml(org)+'</div>' : ''}</div>
    </div>
    ${email ? '<div style="padding:8px 0;border-bottom:var(--bd-thin)"><b>邮箱:</b> '+escapeHtml(email)+'</div>' : ''}
    ${tel ? '<div style="padding:8px 0;border-bottom:var(--bd-thin)"><b>电话:</b> '+escapeHtml(tel)+'</div>' : ''}
  </div>`;
}

// iCalendar 日程渲染
function renderIcs(text) {
  const events = [];
  let cur = null;
  for (const line of text.split(/\r?\n/)) {
    if (line.startsWith('BEGIN:VEVENT')) cur = {};
    else if (line.startsWith('SUMMARY:')) cur && (cur.title = line.slice(8));
    else if (line.startsWith('DTSTART')) cur && (cur.start = line.split(':')[1] || '');
    else if (line.startsWith('DTEND')) cur && (cur.end = line.split(':')[1] || '');
    else if (line.startsWith('LOCATION:')) cur && (cur.location = line.slice(9));
    else if (line.startsWith('DESCRIPTION:')) cur && (cur.desc = line.slice(12));
    else if (line.startsWith('END:VEVENT') && cur) { events.push(cur); cur = null; }
  }
  if (!events.length) return '<div style="padding:20px;text-align:center;color:var(--c-ink-soft)">未找到日程事件</div>';
  let html = '<div style="text-align:left;padding:20px;max-height:60vh;overflow:auto">';
  for (const ev of events) {
    html += `<div style="background:var(--c-paper-warm);border:var(--bd-thin);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px">
      <div style="font-size:16px;font-weight:700;margin-bottom:6px">${escapeHtml(ev.title||'（无标题）')}</div>
      ${ev.start ? '<div style="color:var(--c-ink-soft);font-size:13px">开始: '+escapeHtml(ev.start)+'</div>' : ''}
      ${ev.end ? '<div style="color:var(--c-ink-soft);font-size:13px">结束: '+escapeHtml(ev.end)+'</div>' : ''}
      ${ev.location ? '<div style="color:var(--c-ink-soft);font-size:13px">地点: '+escapeHtml(ev.location)+'</div>' : ''}
      ${ev.desc ? '<div style="color:var(--c-ink-soft);font-size:13px;margin-top:6px">'+escapeHtml(ev.desc)+'</div>' : ''}
    </div>`;
  }
  html += '</div>';
  return html;
}

// Office 文档 / EPUB / ZIP 异步加载预览
async function loadAndPreview(ext, fileUrl, container) {
  const box = container.querySelector('.preview-box') || container.querySelector('.info-banner');
  const loading = document.createElement('div');
  loading.className = 'preview-box';
  loading.style.cssText = 'padding:20px;text-align:center;color:var(--c-ink-soft)';
  loading.textContent = '正在加载预览组件...';
  if (box) box.before(loading); else container.insertBefore(loading, container.firstChild);

  try {
    if (ext === 'docx') {
      await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js');
      const res = await fetch(fileUrl);
      const arrayBuffer = await res.arrayBuffer();
      const result = await window.mammoth.convertToHtml({ arrayBuffer });
      loading.innerHTML = `<div style="text-align:left;padding:20px;max-height:60vh;overflow:auto;line-height:1.8">${result.value || '<p>（文档为空）</p>'}</div>`;
    } else if (ext === 'xlsx' || ext === 'ods') {
      await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
      const res = await fetch(fileUrl);
      const arrayBuffer = await res.arrayBuffer();
      const wb = window.XLSX.read(arrayBuffer, { type: 'array' });
      let html = '<div style="text-align:left;max-height:60vh;overflow:auto;font-size:12px">';
      for (const sheetName of wb.SheetNames) {
        const sheet = wb.Sheets[sheetName];
        html += `<h4 style="margin:10px 0 4px">Sheet: ${escapeHtml(sheetName)}</h4>`;
        html += window.XLSX.utils.sheet_to_html(sheet, { editable: false });
      }
      html += '</div>';
      loading.innerHTML = html;
    } else if (ext === 'pptx') {
      await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
      const res = await fetch(fileUrl);
      const arrayBuffer = await res.arrayBuffer();
      const zip = await window.JSZip.loadAsync(arrayBuffer);
      let html = '<div style="text-align:left;max-height:60vh;overflow:auto">';
      const slideFiles = Object.keys(zip.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f)).sort((a,b) => {
        const na = parseInt(a.match(/slide(\d+)/)[1]); const nb = parseInt(b.match(/slide(\d+)/)[1]); return na - nb;
      });
      for (const sf of slideFiles) {
        const content = await zip.files[sf].async('string');
        const texts = content.match(/<a:t>([^<]*)<\/a:t>/g) || [];
        const slideNum = sf.match(/slide(\d+)/)[1];
        html += `<div style="background:var(--c-paper-warm);border:var(--bd-thin);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px"><div style="font-size:11px;color:var(--c-ink-soft);margin-bottom:6px">Slide ${slideNum}</div>`;
        for (const t of texts) { html += `<div style="margin:3px 0">${escapeHtml(t.replace(/<\/?a:t>/g,''))}</div>`; }
        html += '</div>';
      }
      html += '</div>';
      loading.innerHTML = html || '<div>未找到幻灯片内容</div>';
    } else if (ext === 'epub') {
      await loadScript('https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js');
      await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
      const res = await fetch(fileUrl);
      const arrayBuffer = await res.arrayBuffer();
      loading.innerHTML = '';
      loading.style.cssText = 'min-height:400px';
      const book = window.ePub(arrayBuffer);
      const rendition = book.renderTo(loading, { width: '100%', height: '400px', spread: 'none' });
      rendition.display();
      const nav = document.createElement('div');
      nav.style.cssText = 'display:flex;gap:8px;justify-content:center;margin-top:8px';
      nav.innerHTML = `<button class="btn btn-sm" id="epub-prev">上一页</button><button class="btn btn-sm" id="epub-next">下一页</button>`;
      loading.appendChild(nav);
      $('#epub-prev').onclick = () => rendition.prev();
      $('#epub-next').onclick = () => rendition.next();
    } else if (ext === 'zip') {
      await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
      const res = await fetch(fileUrl);
      const arrayBuffer = await res.arrayBuffer();
      const zip = await window.JSZip.loadAsync(arrayBuffer);
      let html = '<div style="text-align:left;max-height:60vh;overflow:auto;font-family:var(--font-mono,monospace);font-size:12px">';
      const files = Object.keys(zip.files).sort();
      for (const fname of files) {
        const file = zip.files[fname];
        html += `<div style="padding:2px 6px;border-bottom:var(--bd-thin)">${file.dir ? '📁' : '📄'} ${escapeHtml(fname)}</div>`;
      }
      html += `</div><div style="margin-top:6px;color:var(--c-ink-soft);font-size:11px;text-align:center">共 ${files.length} 个条目</div>`;
      loading.innerHTML = html;
    }
  } catch (e) {
    loading.innerHTML = '<div style="padding:20px;text-align:center;color:var(--c-ink-soft)">预览加载失败，请下载文件查看</div>';
  }
}

// 地理文件地图预览
async function loadMapPreview(ext, fileUrl, container) {
  const box = container.querySelector('.preview-box') || container.querySelector('.info-banner');
  const loading = document.createElement('div');
  loading.className = 'preview-box';
  loading.style.cssText = 'padding:20px;text-align:center;color:var(--c-ink-soft)';
  loading.textContent = '正在加载地图组件...';
  if (box) box.before(loading); else container.insertBefore(loading, container.firstChild);

  try {
    await loadScript('https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js');
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(link);
    loading.innerHTML = '<div id="map-share" style="width:100%;height:400px;border-radius:var(--radius-sm)"></div>';
    const map = window.L.map('map-share').setView([0,0], 2);
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

    if (ext === 'geojson') {
      const res = await fetch(fileUrl); const geo = await res.json();
      window.L.geoJSON(geo).addTo(map);
      try { map.fitBounds(window.L.geoJSON(geo).getBounds(), { padding: [20,20] }); } catch {}
    } else if (ext === 'gpx' || ext === 'kml' || ext === 'kmz') {
      await loadScript('https://cdn.jsdelivr.net/npm/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js');
      const layer = window.omnivore[ext === 'kmz' ? 'kml' : ext](fileUrl);
      layer.addTo(map);
      layer.on('ready', () => { try { map.fitBounds(layer.getBounds(), { padding: [20,20] }); } catch {} });
    }
  } catch (e) {
    loading.innerHTML = '<div style="padding:20px;text-align:center;color:var(--c-ink-soft)">地图预览加载失败</div>';
  }
}

function getBaseUrl() {
  return '/api/share/access?token=' + encodeURIComponent(token) + (verifiedPassword ? '&password=' + encodeURIComponent(verifiedPassword) : '');
}

async function loadShare(dir) {
  if (dir !== undefined) currentDir = dir;
  if (!token) {
    $('#body').innerHTML = '<div class="error-state">无效的分享链接</div>';
    return;
  }
  try {
    let url = getBaseUrl();
    if (currentDir) url += '&dir=' + encodeURIComponent(currentDir);
    const res = await fetch(url);
    const data = await res.json().catch(() => ({}));

    if (res.status === 401 && data.needsPassword) {
      renderPasswordForm();
      return;
    }
    if (res.status === 410 || data.error?.includes('expired')) {
      renderExpired();
      return;
    }
    if (!res.ok) {
      $('#body').innerHTML = `<div class="error-state">${escapeHtml(data.error || '分享不存在或已被删除')}</div>`;
      $('#subtitle').textContent = '分享失效';
      return;
    }

    shareInfo = data;
    renderShare(data);
  } catch (e) {
    $('#body').innerHTML = `<div class="error-state">加载失败: ${escapeHtml(e.message)}</div>`;
  }
}

function renderPasswordForm() {
  $('#subtitle').textContent = '此分享需要密码访问';
  $('#body').innerHTML = `
    <div class="info-banner">请输入访问密码以查看分享内容</div>
    <div class="pw-form">
      <input class="input" id="pw-input" type="password" placeholder="访问密码" autofocus>
      <button class="btn btn-primary" id="pw-submit">解锁</button>
    </div>
  `;
  $('#pw-submit').onclick = submitPassword;
  $('#pw-input').onkeydown = (e) => { if (e.key === 'Enter') submitPassword(); };
}

async function submitPassword() {
  const pw = $('#pw-input').value;
  try {
    const res = await fetch('/api/share/access?token=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      alert(data.error || '密码错误');
      return;
    }
    verifiedPassword = pw;
    loadShare();
  } catch (e) {
    alert('验证失败: ' + e.message);
  }
}

function renderBreadcrumb(data) {
  const bc = document.createElement('div');
  bc.className = 'breadcrumb';

  // 根目录
  const root = document.createElement('a');
  root.textContent = '根目录';
  root.onclick = () => loadShare('');
  bc.appendChild(root);

  if (data.dir) {
    const parts = data.dir.split('/').filter(Boolean);
    let acc = '';
    parts.forEach((part, i) => {
      acc += (acc ? '/' : '') + part;
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '/';
      bc.appendChild(sep);

      const isLast = i === parts.length - 1;
      const el = document.createElement(isLast ? 'span' : 'a');
      el.textContent = part;
      if (isLast) {
        el.className = 'current';
      } else {
        el.onclick = () => loadShare(acc);
      }
      bc.appendChild(el);
    });
  }

  return bc;
}

function renderShare(data) {
  $('#subtitle').textContent = data.type === 'folder' ? '文件夹分享' : '文件分享';
  const baseUrl = getBaseUrl();

  if (data.type === 'file') {
    $('#title').textContent = data.name || '文件分享';
    const ext = (data.name.split('.').pop()||'').toLowerCase();
    const fileUrl = `${baseUrl}&download=${encodeURIComponent(data.name)}`;
    let previewHtml = '';
    if (['png','jpg','jpeg','gif','webp','avif','bmp','svg','ico','apng','tiff','tif','heic','heif','jxl'].includes(ext)) {
      previewHtml = `<div class="preview-box"><img src="${fileUrl}" alt="${escapeHtml(data.name)}"></div>`;
    } else if (['mp4','m4v','mov','webm','ogv'].includes(ext)) {
      previewHtml = `<div class="preview-box"><video src="${fileUrl}" controls></video></div>`;
    } else if (['mp3','m4a','ogg','wav','flac','aac','opus','wma','aiff','aif','mka'].includes(ext)) {
      previewHtml = `<div class="preview-box"><audio src="${fileUrl}" controls></audio></div>`;
    } else if (ext === 'pdf') {
      previewHtml = `<div class="preview-box"><iframe src="${fileUrl}" style="width:100%;height:500px;border:var(--bd-thin);border-radius:var(--radius-sm)"></iframe></div>`;
    }

    $('#body').innerHTML = `${previewHtml}
      <div class="info-banner" style="margin-top:12px">
        <b>文件名:</b> ${escapeHtml(data.name)}<br>
        <b>大小:</b> ${formatSize(data.size)}
      </div>
      <div class="btn-bar">
        <a class="btn btn-primary" href="${fileUrl}" download="${escapeHtml(data.name)}">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          下载文件
        </a>
      </div>`;

    // 文本文件：异步加载内容并渲染
    if (['txt','md','json','js','mjs','css','html','htm','xml','csv','log','yaml','yml','toml','ini','conf','py','java','c','cpp','cc','h','hpp','go','rs','sh','bash','zsh','sql','graphql','ics','vcf'].includes(ext)) {
      fetch(fileUrl).then(r => r.text()).then(text => {
        const box = document.querySelector('.preview-box');
        let el;
        if (ext === 'md') {
          el = document.createElement('div');
          el.className = 'preview-box md-viewer';
          el.style.cssText = 'text-align:left;padding:16px;background:var(--c-paper-warm);border:var(--bd-thin);border-radius:var(--radius-sm);max-height:60vh;overflow:auto;line-height:1.7';
          el.innerHTML = renderMarkdown(text);
        } else if (ext === 'vcf') {
          el = document.createElement('div');
          el.className = 'preview-box';
          el.innerHTML = renderVcf(text);
        } else if (ext === 'ics') {
          el = document.createElement('div');
          el.className = 'preview-box';
          el.innerHTML = renderIcs(text);
        } else {
          el = document.createElement('pre');
          el.style.cssText = 'text-align:left;padding:16px;background:var(--c-paper-warm);border:var(--bd-thin);border-radius:var(--radius-sm);font-family:var(--font-mono,monospace);font-size:13px;white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow:auto';
          el.textContent = text;
        }
        if (box) box.replaceWith(el);
        else $('#body').insertBefore(el, $('#body').firstChild);
      }).catch(() => {});
    }

    // Office 文档 / EPUB / ZIP：异步加载 JS 库渲染
    if (['docx','xlsx','ods','pptx','epub','zip'].includes(ext)) {
      loadAndPreview(ext, fileUrl, $('#body'));
    }

    // 地理文件
    if (['geojson','gpx','kml','kmz'].includes(ext)) {
      loadMapPreview(ext, fileUrl, $('#body'));
    }
    return;
  }

  // 文件夹分享
  $('#title').textContent = '文件夹分享';
  const dirs = data.directories || [];
  const items = data.items || [];
  const totalCount = dirs.length + items.length;

  $('#body').innerHTML = '';

  // 面包屑导航
  $('#body').appendChild(renderBreadcrumb(data));

  // 信息栏
  const info = document.createElement('div');
  info.className = 'info-banner';
  info.innerHTML = `<b>项目数:</b> ${totalCount} 个 · <b>已下载:</b> ${data.downloadCount || 0} 次`;
  $('#body').appendChild(info);

  const list = document.createElement('div');
  list.className = 'file-list';

  // 返回上级目录（非根目录时）
  if (data.dir) {
    const parentPath = data.dir.split('/').filter(Boolean).slice(0, -1).join('/');
    const upItem = document.createElement('div');
    upItem.className = 'file-item folder';
    upItem.style.cursor = 'pointer';
    upItem.innerHTML = `
      <span class="ico folder">${iconSvg('folder')}</span>
      <div class="meta">
        <div class="name">..</div>
        <div class="size">返回上级目录</div>
      </div>
      <div class="actions"></div>
    `;
    upItem.onclick = () => loadShare(parentPath);
    list.appendChild(upItem);
  }

  // 文件夹
  dirs.forEach(dir => {
    const item = document.createElement('div');
    item.className = 'file-item folder';
    const subPath = data.dir ? data.dir + dir + '/' : dir + '/';
    item.innerHTML = `
      <span class="ico folder">${iconSvg('folder')}</span>
      <div class="meta">
        <div class="name">${escapeHtml(dir)}/</div>
        <div class="size">文件夹</div>
      </div>
      <div class="actions"></div>
    `;
    item.onclick = () => loadShare(subPath);
    list.appendChild(item);
  });

  // 文件
  items.forEach(file => {
    const cls = iconClass(file.name);
    const dlUrl = baseUrl + '&download=' + encodeURIComponent((data.dir || '') + file.name);
    const item = document.createElement('div');
    item.className = 'file-item';
    const timeStr = file.modified ? new Date(file.modified).toLocaleString('zh-CN') : '';
    item.innerHTML = `
      <span class="ico ${cls}">${iconSvg(cls)}</span>
      <div class="meta">
        <div class="name">${escapeHtml(file.name)}</div>
        <div class="size">${formatSize(file.size)}${timeStr ? ' · ' + timeStr : ''}</div>
      </div>
      <div class="actions">
        <a class="btn btn-ghost btn-sm" href="${dlUrl}" download="${escapeHtml(file.name)}" title="下载" onclick="event.stopPropagation()">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </a>
      </div>
    `;
    list.appendChild(item);
  });

  if (totalCount === 0 && !data.dir) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = '此文件夹为空';
    list.appendChild(empty);
  }

  $('#body').appendChild(list);

  // 按钮栏：打包下载当前目录
  const btnBar = document.createElement('div');
  btnBar.className = 'btn-bar';
  btnBar.innerHTML = `<a class="btn btn-primary" href="${baseUrl}&zip=true" download="share.zip">
    <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    打包下载全部 (ZIP)
  </a>`;
  $('#body').appendChild(btnBar);
}

function renderExpired() {
  $('#subtitle').textContent = '分享已过期';
  $('#body').innerHTML = `
    <div class="expired-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <h3 style="margin-bottom:8px">分享已过期</h3>
      <p>此分享链接已超过有效期，无法访问。</p>
    </div>
  `;
}

loadShare();
</script>
</body>
</html>
